name: Update Dependencies

on:
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Update dependencies
        run: |
          go get -u
          go get github.com/lb-selfbot/discordgo@master
          go mod tidy

      - name: Push changes
        run: |
          git config --global user.name 'LightningDev1'
          git config --global user.email 'LightningDev1@users.noreply.github.com'
          git commit -am "Update dependencies"
          git push
