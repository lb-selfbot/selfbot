name: Build Selfbot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/hosting

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows
            arch: 386
            extension: .exe
            upx: true
          - os: windows
            arch: amd64
            extension: .exe
            upx: true
          - os: windows
            arch: arm64
            extension: .exe
            upx: false
          # Linux builds
          - os: linux
            arch: 386
            extension: ""
            upx: true
          - os: linux
            arch: amd64
            extension: ""
            upx: true
          - os: linux
            arch: arm
            extension: ""
            upx: true
          - os: linux
            arch: arm64
            extension: ""
            upx: true
          # macOS builds
          - os: darwin
            arch: amd64
            extension: ""
            upx: false
          - os: darwin
            arch: arm64
            extension: ""
            upx: false

    steps:
      - uses: actions/checkout@v5

      - name: Cache Go Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.os }}-${{ matrix.arch }}-
            ${{ runner.os }}-go-build-

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go install mvdan.cc/garble@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}

      - name: Build
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOGARBLE: "github.com/lb-selfbot/*,github.com/LightningDev1/*,github.com/gorilla/*,github.com/bogdanfinn/*"
        run: |
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}/selfbot${{ matrix.extension }} ./cmd/desktop

      - name: Compress UPX
        if: ${{ matrix.upx }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}/selfbot${{ matrix.extension }}
          args: --best --lzma

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/executables
          overwrite: true

  build-hosting-multiarch:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o hosting-amd64 ./cmd/hosting

      - name: Build linux/arm64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o hosting-arm64 ./cmd/hosting

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=${GITHUB_SHA::12}
          echo "short=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build amd64 image
        run: |
          cat > Dockerfile.amd64 <<'EOF'
          FROM alpine:latest
          COPY hosting-amd64 /bin/exe
          ENTRYPOINT ["/bin/exe"]
          EOF
          docker build -f Dockerfile.amd64 -t $IMAGE:amd64-${{ steps.tags.outputs.short }} .

      - name: Build arm64 image
        run: |
          cat > Dockerfile.arm64 <<'EOF'
          FROM alpine:latest
          COPY hosting-arm64 /bin/exe
          ENTRYPOINT ["/bin/exe"]
          EOF
          docker build -f Dockerfile.arm64 -t $IMAGE:arm64-${{ steps.tags.outputs.short }} .

      - name: Push arch images
        run: |
          docker push $IMAGE:amd64-${{ steps.tags.outputs.short }}
          docker push $IMAGE:arm64-${{ steps.tags.outputs.short }}

      - name: Create and push multi-arch manifest
        run: |
          docker manifest create $IMAGE:${{ steps.tags.outputs.short }} \
            --amend $IMAGE:amd64-${{ steps.tags.outputs.short }} \
            --amend $IMAGE:arm64-${{ steps.tags.outputs.short }}
          docker manifest push $IMAGE:${{ steps.tags.outputs.short }}
          # Update rolling tags
          docker manifest create $IMAGE:current \
            --amend $IMAGE:amd64-${{ steps.tags.outputs.short }} \
            --amend $IMAGE:arm64-${{ steps.tags.outputs.short }}
          docker manifest push $IMAGE:current
          docker manifest create $IMAGE:latest \
            --amend $IMAGE:amd64-${{ steps.tags.outputs.short }} \
            --amend $IMAGE:arm64-${{ steps.tags.outputs.short }}
          docker manifest push $IMAGE:latest

      - name: Output image tags
        run: |
          echo "Published multi-arch tags: $IMAGE:${{ steps.tags.outputs.short }}, $IMAGE:current, $IMAGE:latest"

  combine-darwin:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Install dependencies
        run: |
          curl -L -o /tmp/lipo https://github.com/konoui/lipo/releases/latest/download/lipo_Linux_amd64
          chmod +x /tmp/lipo

      - name: Download darwin-amd64 builds
        uses: actions/download-artifact@v5
        with:
          name: darwin-amd64
          path: ${{ github.workspace }}/darwin-amd64

      - name: Download darwin-arm64 builds
        uses: actions/download-artifact@v5
        with:
          name: darwin-arm64
          path: ${{ github.workspace }}/darwin-arm64

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/macos

      - name: Combine darwin-amd64 and darwin-arm64
        run: |
          /tmp/lipo -create -output ${{ github.workspace }}/executables/macos/selfbot ${{ github.workspace }}/darwin-amd64/darwin/amd64/selfbot ${{ github.workspace }}/darwin-arm64/darwin/arm64/selfbot

      - name: Upload macOS universal binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: ${{ github.workspace }}/executables
          overwrite: true

      - name: Delete old separate macOS build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            darwin-amd64
            darwin-arm64
