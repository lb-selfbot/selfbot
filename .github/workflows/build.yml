name: Build Selfbot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'src/go.mod'
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/windows/386
          mkdir -p ${{ github.workspace }}/executables/windows/amd64

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest

      - name: Build for Windows
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 1
          GOOS: "windows"
        run: |
          cd src
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/386/selfbot.exe
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/amd64/selfbot.exe

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/windows/386/selfbot.exe
            ${{ github.workspace }}/executables/windows/amd64/selfbot.exe
          args: --lzma

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          name: windows-builds
          path: ${{ github.workspace }}/executables/windows

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/linux/386
          mkdir -p ${{ github.workspace }}/executables/linux/amd64
          mkdir -p ${{ github.workspace }}/executables/linux/arm
          mkdir -p ${{ github.workspace }}/executables/linux/arm64

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest

      - name: Build for Linux
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: "linux"
        run: |
          cd src
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/386/selfbot
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/amd64/selfbot
          export GOARCH=arm
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/arm/selfbot
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/arm64/selfbot

          # Hosting build
          export GOARCH=amd64
          go build ./cmd/hosting -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/LB-Selfbot

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/linux/386/selfbot
            ${{ github.workspace }}/executables/linux/amd64/selfbot
            ${{ github.workspace }}/executables/linux/arm/selfbot
            ${{ github.workspace }}/executables/linux/arm64/selfbot
          args: --lzma

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Upload and delete hosting build
        run: |
          rsync -a ${{ github.workspace }}/executables/LB-Selfbot ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/hosting/LB-Selfbot-New
          rm -rf ${{ github.workspace }}/executables/LB-Selfbot

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          name: linux-builds
          path: ${{ github.workspace }}/executables/linux

  build-darwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib
          go install github.com/konoui/lipo@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/macos/amd64
          mkdir -p ${{ github.workspace }}/executables/macos/arm64

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest

      - name: Build for macOS
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 1
          GOOS: "darwin"
        run: |
          cd src
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/amd64/selfbot
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build ./cmd/desktop -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/arm64/selfbot

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/macos/amd64/selfbot
            ${{ github.workspace }}/executables/macos/arm64/selfbot
          args: --lzma

      - name: Combine darwin-amd64 and darwin-arm64
        run: |
          lipo -create -output ${{ github.workspace }}/executables/macos/selfbot ${{ github.workspace }}/executables/macos/amd64/selfbot ${{ github.workspace }}/executables/macos/arm64/selfbot
          rm -rf ${{ github.workspace }}/executables/macos/amd64
          rm -rf ${{ github.workspace }}/executables/macos/arm64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          name: macos-builds
          path: ${{ github.workspace }}/executables/macos
