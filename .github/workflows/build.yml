name: Build Selfbot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

          go install mvdan.cc/garble@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/windows/386
          mkdir -p ${{ github.workspace }}/executables/windows/amd64
          mkdir -p ${{ github.workspace }}/executables/windows/arm64

      - name: Build for Windows
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: "windows"
          GOGARBLE: "github.com/lb-selfbot/*,github.com/LightningDev1/*"
        run: |
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/386/selfbot.exe ./cmd/desktop
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/amd64/selfbot.exe ./cmd/desktop
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/arm64/selfbot.exe ./cmd/desktop

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/windows/386/selfbot.exe
            ${{ github.workspace }}/executables/windows/amd64/selfbot.exe
          args: --best --lzma

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ github.workspace }}/executables
          overwrite: true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: "go.sum"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

          go install mvdan.cc/garble@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/linux/386
          mkdir -p ${{ github.workspace }}/executables/linux/amd64
          mkdir -p ${{ github.workspace }}/executables/linux/arm
          mkdir -p ${{ github.workspace }}/executables/linux/arm64

      - name: Build for Linux
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: "linux"
          GOGARBLE: "github.com/lb-selfbot/*,github.com/LightningDev1/*"
        run: |
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -o ${{ github.workspace }}/executables/linux/386/selfbot -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" ./cmd/desktop
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -o ${{ github.workspace }}/executables/linux/amd64/selfbot -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" ./cmd/desktop
          export GOARCH=arm
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -o ${{ github.workspace }}/executables/linux/arm/selfbot -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" ./cmd/desktop
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -o ${{ github.workspace }}/executables/linux/arm64/selfbot -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" ./cmd/desktop

          # Hosting build
          export GOARCH=amd64
          go build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/LB-Selfbot ./cmd/hosting

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/linux/386/selfbot
            ${{ github.workspace }}/executables/linux/amd64/selfbot
            ${{ github.workspace }}/executables/linux/arm/selfbot
            ${{ github.workspace }}/executables/linux/arm64/selfbot
          args: --best --lzma

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Upload and delete hosting build
        run: |
          rsync -a ${{ github.workspace }}/executables/LB-Selfbot ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/hosting/LB-Selfbot-New
          rm -rf ${{ github.workspace }}/executables/LB-Selfbot

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ github.workspace }}/executables
          overwrite: true

  build-darwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

          go install github.com/konoui/lipo@latest
          go install mvdan.cc/garble@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/macos/amd64
          mkdir -p ${{ github.workspace }}/executables/macos/arm64

      - name: Build for macOS
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: "darwin"
          GOGARBLE: "github.com/lb-selfbot/*,github.com/LightningDev1/*"
        run: |
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/amd64/selfbot ./cmd/desktop
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/arm64/selfbot ./cmd/desktop

      - name: Combine darwin-amd64 and darwin-arm64
        run: |
          lipo -create -output ${{ github.workspace }}/executables/macos/selfbot ${{ github.workspace }}/executables/macos/amd64/selfbot ${{ github.workspace }}/executables/macos/arm64/selfbot
          rm -rf ${{ github.workspace }}/executables/macos/amd64
          rm -rf ${{ github.workspace }}/executables/macos/arm64

      # TODO: UPX doesn't support macOS
      # - name: Compress UPX
      #   uses: crazy-max/ghaction-upx@v3
      #   with:
      #     version: latest
      #     files: |
      #       ${{ github.workspace }}/executables/macos/selfbot
      #     args: --best --lzma

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: ${{ github.workspace }}/executables
          overwrite: true
