name: Build Selfbot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: '1.18.3'

      - name: Build
        env:
          GOPROXY: "https://proxy.golang.org"
        run: |
          cd Src
          go build .
