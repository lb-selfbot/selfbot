name: Build Selfbot

on:
  workflow_dispatch:

jobs:
  build-win-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: "1.21.1"

      - name: Setup Golang caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

      - name: Create directories
        run: |
          mkdir ${{ github.workspace }}/executables
          mkdir ${{ github.workspace }}/executables/windows
          mkdir ${{ github.workspace }}/executables/windows/386
          mkdir ${{ github.workspace }}/executables/windows/amd64
          mkdir ${{ github.workspace }}/executables/linux
          mkdir ${{ github.workspace }}/executables/linux/386
          mkdir ${{ github.workspace }}/executables/linux/amd64
          mkdir ${{ github.workspace }}/executables/linux/arm
          mkdir ${{ github.workspace }}/executables/linux/arm64
          mkdir ${{ github.workspace }}/executables/macos
          mkdir ${{ github.workspace }}/executables/macos/amd64
          mkdir ${{ github.workspace }}/executables/macos/arm64

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest

      - name: Build for Windows
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 1
          GOOS: "windows"
        run: |
          cd Src
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/386/selfbot.exe
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/windows/amd64/selfbot.exe

      - name: Build for Linux
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: "linux"
        run: |
          cd Src
          export GOARCH=386
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/386/selfbot
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/amd64/selfbot
          export GOARCH=arm
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/arm/selfbot
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/linux/arm64/selfbot

          # Hosting build
          export GOARCH=amd64
          go build -tags hosting -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/LB-Selfbot

      - name: Compress UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/windows/386/selfbot.exe
            ${{ github.workspace }}/executables/windows/amd64/selfbot.exe
            ${{ github.workspace }}/executables/linux/386/selfbot
            ${{ github.workspace }}/executables/linux/amd64/selfbot
            ${{ github.workspace }}/executables/linux/arm/selfbot
            ${{ github.workspace }}/executables/linux/arm64/selfbot
          args: --lzma

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Upload and delete hosting build
        run: |
          rsync -a ${{ github.workspace }}/executables/LB-Selfbot ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/hosting/LB-Selfbot-New
          rm -rf ${{ github.workspace }}/executables/LB-Selfbot

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: "1.21.1"

      - name: Setup Golang caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-

      - name: Create directories
        run: |
          mkdir ${{ github.workspace }}/executables
          mkdir ${{ github.workspace }}/executables/macos
          mkdir ${{ github.workspace }}/executables/macos/amd64
          mkdir ${{ github.workspace }}/executables/macos/arm64

      - name: Install garble
        run: |
          go install mvdan.cc/garble@latest

      - name: Build for macOS
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 1
          GOOS: "darwin"
        run: |
          cd Src
          export GOARCH=amd64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/amd64/selfbot
          export GOARCH=arm64
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags desktop -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/macos/arm64/selfbot

      - name: Combine amd64 and arm64
        run: |
          lipo -create -output ${{ github.workspace }}/executables/macos/selfbot ${{ github.workspace }}/executables/macos/amd64/selfbot ${{ github.workspace }}/executables/macos/arm64/selfbot
          rm -rf ${{ github.workspace }}/executables/macos/amd64
          rm -rf ${{ github.workspace }}/executables/macos/arm64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables
