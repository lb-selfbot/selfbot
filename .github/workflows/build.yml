name: Build Selfbot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: '1.18.3'
          
      - name: Setup Golang caches
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golang-

      - name: Build for Windows
        env:
          GOPROXY: "https://proxy.golang.org"
          GOOS: "windows"
          GOARCH: "amd64"
        run: |
          cd Src
          go build -o ${{ github.workspace }}/LightningBot-windows.exe
          
      - name: Build for Linux
        env:
          GOPROXY: "https://proxy.golang.org"
          GOOS: "linux"
          GOARCH: "amd64"
        run: |
          cd Src
          go build -o ${{ github.workspace }}/LightningBot-linux
          
      - name: Build for MacOS
        env:
          GOPROXY: "https://proxy.golang.org"
          GOOS: "darwin"
          GOARCH: "amd64"
        run: |
          cd Src
          go build -o ${{ github.workspace }}/LightningBot-macos
          
      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: |
            ${{ github.workspace }}/LightningBot.exe
            ${{ github.workspace }}/LightningBot-linux
            ${{ github.workspace }}/LightningBot-macos
