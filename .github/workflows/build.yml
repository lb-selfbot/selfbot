name: Build Selfbot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows
            arch: 386
            extension: .exe
            upx: true
          - os: windows
            arch: amd64
            extension: .exe
            upx: true
          - os: windows
            arch: arm64
            extension: .exe
            upx: false
          # Linux builds
          - os: linux
            arch: 386
            extension: ""
            upx: true
          - os: linux
            arch: amd64
            extension: ""
            upx: true
          - os: linux
            arch: arm
            extension: ""
            upx: true
          - os: linux
            arch: arm64
            extension: ""
            upx: true
          # macOS builds
          - os: darwin
            arch: amd64
            extension: ""
            upx: false
          - os: darwin
            arch: arm64
            extension: ""
            upx: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

          go install mvdan.cc/garble@latest

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}

      - name: Build
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOGARBLE: "github.com/lb-selfbot/*,github.com/LightningDev1/*"
        run: |
          garble -seed=U4Nxq2YSVm6ivvOejQbElA== build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}/selfbot${{ matrix.extension }} ./cmd/desktop

      - name: Compress UPX
        if: ${{ matrix.upx }}
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: |
            ${{ github.workspace }}/executables/${{ matrix.os }}/${{ matrix.arch }}/selfbot${{ matrix.extension }}
          args: --best --lzma

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ github.workspace }}/executables
          overwrite: true

  build-linux-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gcc-multilib

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables

      - name: Build Hosting
        env:
          GOPROXY: "https://proxy.golang.org"
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags timetzdata -trimpath -ldflags "-s -w" -gcflags=all="-l -B" -o ${{ github.workspace }}/executables/LB-Selfbot ./cmd/hosting

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: Upload and delete hosting build
        run: |
          rsync -a ${{ github.workspace }}/executables/LB-Selfbot ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/hosting/LB-Selfbot-New
          rm -rf ${{ github.workspace }}/executables/LB-Selfbot

  combine-darwin:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          curl -L -o /tmp/lipo https://github.com/konoui/lipo/releases/latest/download/lipo_Linux_amd64
          chmod +x /tmp/lipo

      - name: Download darwin-amd64 builds
        uses: actions/download-artifact@v4
        with:
          name: darwin-amd64
          path: ${{ github.workspace }}/darwin-amd64

      - name: Download darwin-arm64 builds
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: ${{ github.workspace }}/darwin-arm64

      - name: Create directories
        run: |
          mkdir -p ${{ github.workspace }}/executables/macos

      - name: Combine darwin-amd64 and darwin-arm64
        run: |
          /tmp/lipo -create -output ${{ github.workspace }}/executables/macos/selfbot ${{ github.workspace }}/darwin-amd64/darwin/amd64/selfbot ${{ github.workspace }}/darwin-arm64/darwin/arm64/selfbot

      - name: Upload macOS universal binary
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: ${{ github.workspace }}/executables
          overwrite: true

      - name: Delete old separate macOS build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            darwin-amd64
            darwin-arm64
